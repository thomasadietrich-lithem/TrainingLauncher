# Fabrication Windows du lanceur NeuroVision (document directeur, chapitre 16.7 P3).
# Sorties (onglet Actions → l'exécution → Artifacts) : Installer_NeuroVision.exe + rapport d'auto-test.
# Aucune clé ni aucun secret n'est utilisé ici (dépôt public : les journaux sont publics).
name: Fabriquer l'installeur Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nvs_lanceur/**"
      - "moteur/**"
      - "installeur/**"
      - "NeuroVision.py"
      - ".github/workflows/fabriquer-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: moteur/requirements-moteur.txt

      - name: Installer le moteur (PsychoPy 2024.2.4 sans ses dépendances + liste choisie) et PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r moteur/requirements-moteur.txt 2>&1 | Tee-Object pip.log
          if ($LASTEXITCODE -ne 0) { Get-Content pip.log -Tail 12 | ForEach-Object { "::error::$_" }; throw "pip" }
          python -m pip install --no-deps psychopy==2024.2.4 2>&1 | Tee-Object pip2.log
          if ($LASTEXITCODE -ne 0) { Get-Content pip2.log -Tail 12 | ForEach-Object { "::error::$_" }; throw "pip psychopy" }
          python -m pip freeze | Out-File pip_freeze.txt

      - name: Tests du lanceur (sous Windows)
        shell: pwsh
        run: |
          python -m unittest discover -s tests 2>&1 | Tee-Object tests.log
          if ($LASTEXITCODE -ne 0) { Select-String -Path tests.log -Pattern "^(FAIL|ERROR|AssertionError|\w+Error)" | Select-Object -First 10 | ForEach-Object { "::error::$($_.Line)" }; throw "tests" }

      - name: Lire la version du lanceur
        id: version
        shell: bash
        run: echo "v=$(python -c 'import nvs_lanceur;print(nvs_lanceur.VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Geler NeuroVision.exe (PyInstaller, dossier)
        shell: pwsh
        run: |
          pyinstaller moteur/NeuroVision.spec --noconfirm --distpath dist --workpath build 2>&1 | Tee-Object pyi.log
          if ($LASTEXITCODE -ne 0) { Get-Content pyi.log -Tail 12 | ForEach-Object { "::error::$_" }; throw "pyinstaller" }

      - name: Auto-test de l'exécutable gelé
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\NeuroVision\NeuroVision.exe" -ArgumentList "--auto-test","auto_test.txt" -Wait -PassThru
          Get-Content auto_test.txt
          Get-Content auto_test.txt | ForEach-Object { if ($_ -match "ÉCHEC|psychopy|lanceur") { "::notice::$_" } }
          if ($p.ExitCode -ne 0) { throw "auto-test en échec (code $($p.ExitCode))" }
          "{0:N0} Mo" -f ((Get-ChildItem dist\NeuroVision -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Installer Inno Setup si absent
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compiler l'installeur
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.v }}" "/DSourceDir=..\dist\NeuroVision" installeur\NeuroVision.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué" }
          Get-FileHash sortie\Installer_NeuroVision.exe -Algorithm SHA256 | Format-List

      - name: Essai d'installation silencieuse puis désinstallation
        shell: pwsh
        run: |
          $p = Start-Process sortie\Installer_NeuroVision.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installation en échec ($($p.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\NeuroVisionSolidaire\app\NeuroVision.exe"
          if (-not (Test-Path $exe)) { throw "NeuroVision.exe absent après installation" }
          $t = Start-Process $exe -ArgumentList "--auto-test","$env:RUNNER_TEMP\auto_test_installe.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\auto_test_installe.txt"
          if ($t.ExitCode -ne 0) { throw "auto-test de la version installée en échec" }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\NeuroVision Solidaire.lnk")) { Write-Warning "raccourci bureau introuvable" }
          $u = Start-Process "$env:LOCALAPPDATA\NeuroVisionSolidaire\app\unins000.exe" -ArgumentList "/VERYSILENT" -Wait -PassThru
          "désinstallation : code $($u.ExitCode)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Installer_NeuroVision-${{ steps.version.outputs.v }}
          path: |
            sortie/Installer_NeuroVision.exe
            auto_test.txt
            pip_freeze.txt
          retention-days: 30
