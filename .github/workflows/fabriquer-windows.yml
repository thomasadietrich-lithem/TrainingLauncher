# Fabrication Windows du lanceur NeuroVision (document directeur, chapitre 16.7 P3).
# Téléchargement (onglet Actions → l'exécution → Artifacts) : un zip contenant Installer_NeuroVision.exe et un dossier
# « Rapport de fabrication » (auto-test, versions des bibliothèques).
# Aucune clé ni aucun secret n'est utilisé ici (dépôt public : les journaux sont publics).
name: Fabriquer l'installeur Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nvs_lanceur/**"
      - "moteur/**"
      - "installeur/**"
      - "NeuroVision.py"
      - "msix/**"
      - ".github/workflows/fabriquer-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: moteur/requirements-moteur.txt

      - name: Installer le moteur (PsychoPy 2025.1.1 sans ses dépendances + liste choisie) et PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r moteur/requirements-moteur.txt 2>&1 | Tee-Object pip.log
          if ($LASTEXITCODE -ne 0) { Get-Content pip.log -Tail 12 | ForEach-Object { "::error::$_" }; throw "pip" }
          python -m pip install --no-deps psychopy==2025.1.1 2>&1 | Tee-Object pip2.log
          if ($LASTEXITCODE -ne 0) { Get-Content pip2.log -Tail 12 | ForEach-Object { "::error::$_" }; throw "pip psychopy" }
          python -m pip freeze | Out-File pip_freeze.txt

      - name: Tests du lanceur (sous Windows)
        shell: pwsh
        run: |
          python -m unittest discover -s tests 2>&1 | Tee-Object tests.log
          if ($LASTEXITCODE -ne 0) { Select-String -Path tests.log -Pattern "^(FAIL|ERROR|AssertionError|\w+Error)" | Select-Object -First 10 | ForEach-Object { "::error::$($_.Line)" }; throw "tests" }

      - name: Lire la version du lanceur
        id: version
        shell: bash
        run: echo "v=$(python -c 'import nvs_lanceur;print(nvs_lanceur.VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Geler NeuroVision.exe (PyInstaller, dossier)
        shell: pwsh
        run: |
          pyinstaller moteur/NeuroVision.spec --noconfirm --distpath dist --workpath build 2>&1 | Tee-Object pyi.log
          if ($LASTEXITCODE -ne 0) { Get-Content pyi.log -Tail 12 | ForEach-Object { "::error::$_" }; throw "pyinstaller" }

      - name: Auto-test de l'exécutable gelé
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\NeuroVision\NeuroVision.exe" -ArgumentList "--auto-test","auto_test.txt" -Wait -PassThru
          Get-Content auto_test.txt
          Get-Content auto_test.txt | ForEach-Object { if ($_ -match "ÉCHEC|psychopy|lanceur") { "::notice::$_" } }
          if ($p.ExitCode -ne 0) { throw "auto-test en échec (code $($p.ExitCode))" }
          "{0:N0} Mo" -f ((Get-ChildItem dist\NeuroVision -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Installer Inno Setup si absent
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compiler l'installeur
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.v }}" "/DSourceDir=..\dist\NeuroVision" installeur\NeuroVision.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué" }
          Get-FileHash sortie\Installer_NeuroVision.exe -Algorithm SHA256 | Format-List

      - name: Essai d'installation silencieuse puis désinstallation
        shell: pwsh
        run: |
          $p = Start-Process sortie\Installer_NeuroVision.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installation en échec ($($p.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\NeuroVisionSolidaire\app\NeuroVision.exe"
          if (-not (Test-Path $exe)) { throw "NeuroVision.exe absent après installation" }
          $t = Start-Process $exe -ArgumentList "--auto-test","$env:RUNNER_TEMP\auto_test_installe.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\auto_test_installe.txt"
          if ($t.ExitCode -ne 0) { throw "auto-test de la version installée en échec" }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\NeuroVision Solidaire.lnk")) { Write-Warning "raccourci bureau introuvable" }
          $u = Start-Process "$env:LOCALAPPDATA\NeuroVisionSolidaire\app\unins000.exe" -ArgumentList "/VERYSILENT" -Wait -PassThru
          "désinstallation : code $($u.ExitCode)"

      - name: Paquet Microsoft Store (MSIX) — fabrication
        shell: pwsh
        env:
          MSIX_NOM: ${{ vars.MSIX_NOM }}
          MSIX_EDITEUR: ${{ vars.MSIX_EDITEUR }}
          MSIX_EDITEUR_AFFICHE: ${{ vars.MSIX_EDITEUR_AFFICHE }}
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "makeappx introuvable" }
          "MAKEAPPX=$($sdk.FullName)" | Out-File -Append $env:GITHUB_ENV
          "SIGNTOOL=$(Join-Path $sdk.DirectoryName 'signtool.exe')" | Out-File -Append $env:GITHUB_ENV
          $version = "${{ steps.version.outputs.v }}.0"
          function Fabriquer($nom, $editeur, $affiche, $sortie) {
            Remove-Item -Recurse -Force msix_couche -ErrorAction SilentlyContinue
            Copy-Item -Recurse dist\NeuroVision msix_couche
            Copy-Item -Recurse msix\Assets msix_couche\Assets
            (Get-Content msix\AppxManifest.modele.xml -Raw -Encoding utf8).Replace('__NOM__',$nom).Replace('__EDITEUR__',$editeur).Replace('__EDITEUR_AFFICHE__',$affiche).Replace('__VERSION__',$version) | Set-Content msix_couche\AppxManifest.xml -Encoding utf8
            & $sdk.FullName pack /o /d msix_couche /p $sortie | Out-File makeappx.log
            if ($LASTEXITCODE -ne 0) { Get-Content makeappx.log -Tail 12 | ForEach-Object { "::error::$_" }; throw "makeappx" }
          }
          # 1) paquet d'ESSAI (identité de test, signé ci-dessous par un certificat jetable)
          Fabriquer "NeuroVisionSolidaire.Essai" "CN=NeuroVision-Essai" "NeuroVision (essai)" "NeuroVision_essai.msix"
          # 2) paquet STORE (non signé : le Store le signe) — seulement si l'identité Partner Center est renseignée
          if ($env:MSIX_NOM -and $env:MSIX_EDITEUR) {
            Fabriquer $env:MSIX_NOM $env:MSIX_EDITEUR ($env:MSIX_EDITEUR_AFFICHE ?? "NeuroVision Solidaire") "NeuroVision_Store.msix"
            "::notice::paquet Store fabriqué pour $env:MSIX_NOM"
          } else { "::notice::identité Partner Center absente (variables MSIX_NOM / MSIX_EDITEUR) : paquet Store non fabriqué" }

      - name: Paquet MSIX — essai d'installation, lancement et désinstallation
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=NeuroVision-Essai" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $mdp = ConvertTo-SecureString -String "essai-jetable" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath essai.pfx -Password $mdp | Out-Null
          Export-Certificate -Cert $cert -FilePath essai.cer | Out-Null
          Import-Certificate -FilePath essai.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          & $env:SIGNTOOL sign /fd SHA256 /f essai.pfx /p essai-jetable NeuroVision_essai.msix | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "signtool (essai)" }
          Add-AppxPackage -Path NeuroVision_essai.msix
          $sortie = "$env:RUNNER_TEMP\auto_test_msix.txt"
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\NeuroVisionSolidaire.exe"
          $p = Start-Process $alias -ArgumentList "--auto-test",$sortie -Wait -PassThru
          Get-Content $sortie | ForEach-Object { "::notice::MSIX $_" }
          if ($p.ExitCode -ne 0) { throw "auto-test du paquet MSIX en échec" }
          Get-AppxPackage NeuroVisionSolidaire.Essai | Remove-AppxPackage
          Remove-Item essai.pfx, essai.cer

      - name: Préparer le téléchargement (installeur à la racine, rapports à part)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "telechargement\Rapport de fabrication" | Out-Null
          if (Test-Path sortie\Installer_NeuroVision.exe) { Copy-Item sortie\Installer_NeuroVision.exe telechargement\ }
          foreach ($f in "auto_test.txt","pip_freeze.txt") { if (Test-Path $f) { Copy-Item $f "telechargement\Rapport de fabrication\" } }
          if (Test-Path NeuroVision_Store.msix) { New-Item -ItemType Directory -Force "telechargement\Microsoft Store" | Out-Null; Copy-Item NeuroVision_Store.msix "telechargement\Microsoft Store\" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeuroVision-${{ steps.version.outputs.v }}-installeur-Windows
          path: telechargement/
          retention-days: 30
